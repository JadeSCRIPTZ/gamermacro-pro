name: Build GamerMacro Pro EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Build EXE
        run: pyinstaller --noconfirm --onefile --windowed --name "GamerMacroPro" --add-data "ui;ui" app.py

      - name: Get date
        id: date
        run: echo "date=$(Get-Date -Format 'yyyy-MM-dd')" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v7.0-${{ steps.date.outputs.date }}
          name: "GamerMacro Pro v7.0 — Nebula UI — ${{ steps.date.outputs.date }}"
          body: |
            ## 🎮 GamerMacro Pro — Nebula UI
            Interfata complet noua: gradient mov-grafit, glassmorphism, sidebar modern.

            ### ⬇️ Download
            Click pe **GamerMacro Pro.exe** — fara Python instalat!

            ### Features
            - 🎣 Macro — detector pixel principal (pescuit), click dreapta
            - ❄️ Winter — al doilea detector, click stanga configurabil (nr. click-uri + interval sec/ms)
            - 🎯 Pixel picker cu numaratoare de 3 secunde, identic pentru ambele detectoare
            - 🗂️ Profile complete (salveaza/incarca toate setarile)
            - 📊 Statistici live, 📋 Log color-codat
          files: dist/GamerMacroPro.exe
